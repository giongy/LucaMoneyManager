name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ 'mobile/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build keystore from PEM secrets
        env:
          SIGNING_KEY:  ${{ secrets.SIGNING_KEY }}
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
        run: |
          echo "$SIGNING_KEY"  > /tmp/signing.key
          echo "$SIGNING_CERT" > /tmp/signing.crt
          openssl pkcs12 -export \
            -in /tmp/signing.crt \
            -inkey /tmp/signing.key \
            -out mobile/android/app/lucamoney.keystore \
            -passout pass:lucamoney123 \
            -name lucamoney

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Publish APK as release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          # --prerelease non e' cosmetico: questa release viene ricreata a ogni push su
          # mobile/**, quindi la sua data e' sempre la piu' recente e senza il flag si
          # prenderebbe il badge "Latest" di GitHub. Li' punta /releases/latest, cioe' il
          # pulsante Download del README: chi cerca l'app Windows si ritroverebbe un APK.
          gh release create latest \
            --prerelease \
            --title "LucaMoney Android - latest build" \
            --notes "Automatic build of the Android companion app from the latest commit on master.

            This is the phone app: it reads the database produced by the Windows desktop app and cannot be used on its own. For the desktop installer see the latest release." \
            mobile/android/app/build/outputs/apk/release/app-release.apk#LucaMoney.apk
