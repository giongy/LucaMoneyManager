name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ 'mobile/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > mobile/android/app/lucamoney.keystore

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: mobile/android
        env:
          KEYSTORE_PATH: lucamoney.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Publish APK as release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest \
            --title "LucaMoney - latest build" \
            --notes "Build automatico dall'ultimo commit su master." \
            mobile/android/app/build/outputs/apk/release/app-release.apk#LucaMoney.apk
