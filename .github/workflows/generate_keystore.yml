name: Generate Keystore (esegui una volta sola)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore and print base64
        run: |
          keytool -genkeypair -v \
            -keystore lucamoney.keystore \
            -alias lucamoney \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass lucamoney123 \
            -keypass lucamoney123 \
            -dname "CN=LucaMoney,O=Personal,C=IT" \
            -storetype JKS
          echo ""
          echo "===== COPIA QUESTA RIGA COME SECRET KEYSTORE_BASE64 ====="
          base64 -w 0 lucamoney.keystore
          echo ""
          echo "========================================================="
