name: Generate Signing Keys (esegui una volta sola)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate RSA key and self-signed certificate
        run: |
          openssl genrsa -out signing.key 2048
          openssl req -new -x509 -key signing.key -out signing.crt \
            -days 10000 -subj "/CN=LucaMoney/O=Personal/C=IT"

          echo ""
          echo "===== SIGNING_KEY (crea secret con questo nome e contenuto) ====="
          cat signing.key
          echo "===== SIGNING_CERT (crea secret con questo nome e contenuto) ====="
          cat signing.crt
          echo "=================================================================="
