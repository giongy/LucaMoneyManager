name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ 'mobile/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build keystore from PEM secrets
        env:
          SIGNING_KEY:  ${{ secrets.SIGNING_KEY }}
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
        run: |
          echo "$SIGNING_KEY"  > /tmp/signing.key
          echo "$SIGNING_CERT" > /tmp/signing.crt
          openssl pkcs12 -export \
            -in /tmp/signing.crt \
            -inkey /tmp/signing.key \
            -out mobile/android/app/lucamoney.keystore \
            -passout pass:lucamoney123 \
            -name lucamoney

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: mobile/android
        env:
          KEYSTORE_PATH:     lucamoney.keystore
          KEYSTORE_PASSWORD: lucamoney123
          KEY_ALIAS:         lucamoney
          KEY_PASSWORD:      lucamoney123
        run: ./gradlew assembleRelease

      - name: Publish APK as release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest \
            --title "LucaMoney - latest build" \
            --notes "Build automatico dall'ultimo commit su master." \
            mobile/android/app/build/outputs/apk/release/app-release.apk#LucaMoney.apk
