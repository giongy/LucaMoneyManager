<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Luca Money Manager</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #2f6b5e;
    font-family: 'Helvetica Neue', 'Segoe UI', 'Roboto', Arial, sans-serif;
    color: #ffffff;
    -webkit-font-smoothing: antialiased;
  }

  .splash {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    opacity: 0;
    animation: fadeIn 700ms ease-out forwards;
  }

  .splash.fade-out {
    animation: fadeOut 500ms ease-in forwards;
  }

  @keyframes fadeOut {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .rule {
    width: 78%;
    height: 1px;
    background: rgba(255, 255, 255, 0.45);
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 6px;
    opacity: 0.75;
    margin: 28px 0 40px;
  }

  .title {
    font-size: 52px;
    font-weight: 200;
    letter-spacing: 16px;
    padding-left: 16px;
    line-height: 1;
    margin-bottom: 18px;
  }

  .subtitle {
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 12px;
    padding-left: 12px;
    opacity: 0.92;
    margin-bottom: 22px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: rgba(255, 255, 255, 0.7);
    margin-bottom: 22px;
  }

  .tagline {
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 5px;
    opacity: 0.7;
    margin-bottom: 40px;
  }

  .footer {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    padding: 0 36px;
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 3px;
    opacity: 0.55;
  }

  .dots::after {
    content: '';
    display: inline-block;
    width: 20px;
    text-align: left;
    animation: dots 1.4s steps(4, end) infinite;
  }

  @keyframes dots {
    0%   { content: ''; }
    25%  { content: ' .'; }
    50%  { content: ' . .'; }
    75%  { content: ' . . .'; }
    100% { content: ''; }
  }

  @media (max-width: 700px) {
    .title    { font-size: 36px; letter-spacing: 10px; padding-left: 10px; }
    .subtitle { font-size: 15px; letter-spacing: 8px;  padding-left: 8px; }
    .eyebrow  { letter-spacing: 4px; margin-bottom: 28px; }
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="rule"></div>
    <div class="eyebrow">PERSONAL FINANCE</div>
    <div class="title">LUCA MONEY</div>
    <div class="subtitle">M A N A G E R</div>
    <div class="divider"></div>
    <div class="tagline">TRACK &nbsp;·&nbsp; ANALYZE &nbsp;·&nbsp; GROW</div>
    <div class="rule"></div>
    <div class="footer">
      <span>v${project.version}</span>
      <span class="dots">LOADING</span>
    </div>
  </div>
  <script>
    setTimeout(function() {
      document.querySelector('.splash').classList.add('fade-out');
      setTimeout(function() {
        window.location.replace('./index.html');
      }, 500);
    }, 1600);
  </script>
</body>
</html>
